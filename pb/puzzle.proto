syntax = "proto3";
package crossme;

import "google/protobuf/timestamp.proto";

option go_package = "crossme.app/src/pb";

message Puzzle {
    string title = 1;
    string author = 2;
    string copyright = 3;
    string note = 4;
    int32 width = 5;
    int32 height = 6;

    repeated Cell squares = 8;
    repeated Clue across_clues = 9;
    repeated Clue down_clues = 10;

    Meta metadata = 11;

    message Cell {
        int32 number = 1;
        bool black = 2;
        bool circled = 3;
        string fill = 4;
        int32 clue_across = 5;
        int32 clue_down = 6;
    }

    message Clue {
        int32 number = 1;
        string text = 3;
    }

    message Meta {
        google.protobuf.Timestamp created = 1;

        // sha256 of the .puz file that imported to this puzzle, in
        // hex
        string sha256 = 2;

        // Unique ID used to refer to this puzzle
        string id = 5;

        // YYYY-MM-DD parsed date that the puzzle was published, or ""
        string date = 3;
    }
}

message PuzzleIndex {
    string id = 1;
    string title = 2;
    string date = 3;
    string author = 4;

    // The caller's own game of this puzzle, so the list can link back
    // to it. Unset for anonymous callers, and for puzzles the caller has
    // not played. A user who has played a puzzle more than once gets a
    // single game here: a solved one if there is one, otherwise the most
    // recently played.
    Game game = 5;

    message Game {
        string id = 1;
        // When the caller last opened the game.
        google.protobuf.Timestamp last_played = 2;
        // Set once the game has been solved; unset while in progress.
        google.protobuf.Timestamp completed_at = 3;
    }
}
