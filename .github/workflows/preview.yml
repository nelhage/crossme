name: Preview

# Deploys every pull request as its own Fly.io app, built from
# Dockerfile.preview (see fly.toml), and destroys the app when the PR closes.
# The preview runs the whole app in one container on an empty database.
#
# Needs the FLY_API_TOKEN repository secret: an org-scoped Fly token, since the
# action creates and destroys apps and machines (`fly tokens create org`).
# Also needs the
# GCP_WORKLOAD_IDENTITY_PROVIDER repository variable, the full resource name
# of the Workload Identity Federation provider that trusts Fly's OIDC tokens,
# which the preview uses to fetch its database snapshot (see README).

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  FLY_ORG: personal
  # Must match primary_region in fly.toml; see the note there.
  FLY_REGION: sjc

permissions:
  contents: read
  deployments: write

jobs:
  # Some pull requests run without repository secrets: PRs from forks, and
  # PRs opened by Dependabot (which only sees its own, separate secrets).
  # Those can't deploy, so skip the preview rather than fail it. A job-level
  # `if` can't read `secrets`, hence this gate job. Dependabot is the known
  # case, so skip it outright here; `preview` is then skipped too, since it
  # needs this job.
  check-credentials:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        run: |
          if [ -n "$FLY_API_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "No FLY_API_TOKEN in this run; skipping the preview deploy."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

  preview:
    runs-on: ubuntu-latest
    needs: check-credentials
    if: needs.check-credentials.outputs.available == 'true'

    # One deploy at a time per PR. Deliberately not cancel-in-progress: a
    # destroy on close must not race a half-finished deploy.
    concurrency:
      group: preview-pr-${{ github.event.number }}

    # A GitHub deployment environment per PR, so the preview URL shows up in
    # the pull request's sidebar.
    environment:
      name: preview-pr-${{ github.event.number }}
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - uses: actions/checkout@v7

      - name: Check configuration
        if: github.event.action != 'closed'
        env:
          PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          if [ -z "$PROVIDER" ]; then
            echo "::error::Set the GCP_WORKLOAD_IDENTITY_PROVIDER repository variable; the preview can't fetch its database without it."
            exit 1
          fi

      - name: Deploy preview
        id: deploy
        uses: superfly/fly-pr-review-apps@1.5.0
        with:
          name: crossme-pr-${{ github.event.number }}
          # The app has no way to learn its own public URL, and needs it for
          # OAuth redirects: previews sign users in through production (see
          # CROSSME_LOGIN_VIA in fly.toml), which only redirects back to a
          # https://crossme-pr-*.fly.dev callback.
          secrets: >-
            CROSSME_BASE_URL=https://crossme-pr-${{ github.event.number }}.fly.dev
            CROSSME_GCP_IDENTITY_PROVIDER=${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}

      # The action deploys with `--regions $FLY_REGION`, which only touches
      # machines already in that region. Should a machine ever end up
      # elsewhere (Fly places one in a neighboring region when the requested
      # one is out of capacity), every later deploy leaves it on its old
      # image and creates a fresh one, so the preview serves two different
      # builds depending on where the visitor is routed. Whichever machine
      # is newest carries the image just deployed (an in-place update keeps
      # the only machine; otherwise the deploy created it), so drop the
      # rest. Previews keep no state on their machines, so this loses
      # nothing.
      - uses: superfly/flyctl-actions/setup-flyctl@1.6
        if: github.event.action != 'closed'

      - name: Remove stale machines
        if: github.event.action != 'closed'
        env:
          APP: crossme-pr-${{ github.event.number }}
        run: |
          stale=$(flyctl machine list --app "$APP" --json \
            | jq -r 'sort_by(.created_at) | .[:-1][] | .id')
          for id in $stale; do
            echo "Destroying stale machine $id"
            flyctl machine destroy "$id" --app "$APP" --force
          done
          flyctl machine list --app "$APP"
